<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile | KNEXA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script>if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) { document.documentElement.setAttribute('data-theme', 'dark'); }</script>
</head>
<body>
    
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">KNEXA</a>
            <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="discover.html">Discover</a></li>
                    <li><a href="skill-dna.html">Skill DNA</a></li>
                    
                    <li><a href="messages.html">Skill Exchange</a></li>
                    <li><a href="feed.html">Knowledge Hub</a></li>
                    <li><a href="profile.html">Profile</a></li>
                </ul>
            <div class="nav-actions">
                <button id="theme-toggle" class="btn btn-outline" style="padding: 0.5rem; border:none;" aria-label="Toggle Theme"><i class="fas fa-moon"></i></button>
                <a href="messages.html" class="btn btn-outline" style="border:none; padding: 0.5rem;"><i class="fas fa-envelope"></i></a>
                <a href="profile.html" class="btn btn-primary" style="padding: 0.5rem 1rem;">Profile</a>
            </div>
        </div>
    </nav>

    <div class="container" style="padding-top: 8rem; min-height: 100vh; padding-bottom: 4rem;">
        
        <div class="profile-layout">
            
            
            <div class="profile-sidebar">
                <div class="profile-identity-card auth-card" style="text-align: center; padding: 2rem;">
                    <div class="profile-avatar-large" id="user-avatar-initial">?</div>
                    
                    <h2 id="user-name" style="margin-top: 1rem; margin-bottom: 0.25rem;">Loading...</h2>
                    <p style="color: var(--color-text-muted); font-size: 0.875rem; margin-bottom: 1rem;">
                        <span id="user-username">@user</span> • <span id="user-country">Earth</span>
                    </p>

                    <button class="btn btn-primary btn-full" id="btn-connect" style="margin-top: 1.5rem;"><i class="fas fa-user-plus"></i> Connect</button>
                    <button class="btn btn-outline btn-full" id="btn-message" style="margin-top: 0.5rem; display:none;"><i class="fas fa-envelope"></i> Message</button>
                </div>

                <div class="profile-bio-card auth-card" style="margin-top: 1.5rem; padding: 1.5rem;">
                    <h3 style="margin-bottom: 1rem; font-size: 1.1rem;"><i class="fas fa-user"></i> About Me</h3>
                    <p id="user-bio" style="color: var(--color-text-muted); font-size: 0.9rem; line-height: 1.6;">
                        No bio written yet.
                    </p>
                </div>
            </div>

            
            <div class="profile-main">
                
                
                <div class="connection-status-banner">
                    <div>
                        <h3 style="margin:0; font-size:1.1rem;">KNEXA Compatibility: <span id="compat-score" style="color:var(--color-primary); font-weight:800;">0%</span></h3>
                        <p id="compat-category" style="margin:0; font-size:0.875rem; color:var(--color-text-muted);">Analyzing Match...</p>
                    </div>
                    <div id="compat-reasons" style="font-size:0.875rem; text-align:right;">
                    </div>
                </div>

                
                <div class="profile-skills-grid">
                    
                    <div class="auth-card" style="padding: 1.5rem;">
                        <h3 style="margin-bottom: 1rem; font-size: 1rem; display:flex; align-items:center; gap:0.5rem;">
                            <i class="fas fa-brain" style="color:var(--color-primary);"></i> Can Share
                        </h3>
                        <ul class="profile-skill-list" id="list-shared">
                            <li class="empty-list">No skills shared yet.</li>
                        </ul>
                    </div>

                    <div class="auth-card" style="padding: 1.5rem;">
                        <h3 style="margin-bottom: 1rem; font-size: 1rem; display:flex; align-items:center; gap:0.5rem;">
                            <i class="fas fa-seedling" style="color:var(--color-secondary);"></i> Learning
                        </h3>
                        <ul class="profile-skill-list" id="list-learning">
                            <li class="empty-list">Not learning any skills yet.</li>
                        </ul>
                    </div>

                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/app.js?v=2"></script>
    <script type="module" src="js/user.js"></script>
</body>
</html>
