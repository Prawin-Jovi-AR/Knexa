<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | KNEXA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script>if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) { document.documentElement.setAttribute('data-theme', 'dark'); }</script>
</head>
<body class="auth-page">
    
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">KNEXA</a>
            <div class="nav-menu" style="display: flex; justify-content: flex-end; width: 100%;">
                <div class="nav-actions">
                    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Dark Mode">
                        <i class="fas fa-moon"></i>
                    </button>
                    <a href="signup.html" class="btn btn-outline">Sign Up</a>
                </div>
            </div>
        </div>
    </nav>

    
    <div class="auth-container">
        <div class="auth-card">
            <h2>Welcome Back</h2>
            <p class="auth-subtitle">Log in to continue your knowledge journey.</p>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">Email or Username</label>
                    <input type="text" id="login-email" class="form-input" required placeholder="your@email.com or username">
                </div>
                <div class="form-group" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                    <label for="login-password" style="margin-bottom: 0;">Password</label>
                    <a href="#" id="forgot-password-link" style="font-size: 0.875rem; color: var(--color-primary); font-weight: 500;">Forgot Password?</a>
                </div>
                <div class="form-group">
                    <input type="password" id="login-password" class="form-input" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary btn-full">Log In</button>
                <a href="signup.html" class="btn btn-outline btn-full" style="margin-top: 0.5rem;">Create Account</a>
            </form>
        </div>
    </div>

    <script type="module" src="js/app.js?v=2"></script>
</body>
</html>
