<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Feed | KNEXA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script>if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) { document.documentElement.setAttribute('data-theme', 'dark'); }</script>
</head>
<body>
    
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">KNEXA</a>
            
            <div class="nav-menu" id="nav-menu">
            <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="discover.html">Discover</a></li>
                    <li><a href="skill-dna.html">Skill DNA</a></li>
                    
                    <li><a href="messages.html">Skill Exchange</a></li>
                    <li><a href="feed.html" class="active">Knowledge Hub</a></li>
                    <li><a href="profile.html">Profile</a></li>
                </ul>
            <div class="nav-actions">

                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Dark Mode">
                    <i class="fas fa-moon"></i>
                </button>
                <a href="messages.html" class="btn btn-outline" style="border:none; padding: 0.5rem;" title="Messages">
                    <i class="fas fa-envelope"></i>
                </a>
                <a href="profile.html" class="btn btn-primary" style="padding: 0.5rem 1rem;">Profile</a>
                        </div>
        </div>
        <button class="hamburger" id="hamburger" aria-label="Menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </button>
    </div>
</nav>

    <div class="container" style="padding-top: 8rem; min-height: 100vh; padding-bottom: 4rem;">
        
        <div class="feed-layout">
            
            
            <div class="feed-sidebar-left">
                <div class="auth-card" style="padding: 1.5rem; text-align: center;">
                    <div class="profile-avatar-large" id="feed-avatar" style="width:80px; height:80px; font-size:2rem; margin: 0 auto 1rem;">?</div>
                    <h3 id="feed-name">Loading...</h3>
                    <p id="feed-username" style="color:var(--color-text-muted); font-size: 0.875rem; margin-bottom:1rem;">@user</p>
                    <a href="profile.html" class="btn btn-outline btn-full">My Profile</a>
                </div>
            </div>

            
            <div class="feed-main">
                
                
                <div class="auth-card" style="padding: 1.5rem; margin-bottom: 2rem;">
                    <form id="post-form">
                        <textarea id="post-content" class="form-input" placeholder="Share your knowledge, ask a question, or post an update..." rows="3" style="resize:none;" required></textarea>
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 1rem;">
                            <select id="post-category" class="form-input" style="width: auto; border-radius: 999px;">
                                <option value="General">General</option>
                                <option value="Question">Question</option>
                                <option value="Resource">Resource</option>
                                <option value="Achievement">Achievement</option>
                            </select>
                            <button type="submit" class="btn btn-primary" id="btn-submit-post">Post</button>
                        </div>
                    </form>
                </div>

                
                <div id="feed-stream" style="display: flex; flex-direction: column; gap: 1.5rem;">
                    <div style="text-align:center; padding: 2rem;">
                        <i class="fas fa-spinner fa-spin" style="font-size: 2rem; color: var(--color-primary);"></i>
                    </div>
                </div>

            </div>

            
            <div class="feed-sidebar-right">
                <div class="auth-card" style="padding: 1.5rem;">
                    <h3 style="font-size: 1rem; margin-bottom: 1rem;">Top Matches</h3>
                    <div id="feed-matches-widget">
                        
                        <p style="color:var(--color-text-muted); font-size:0.875rem;">Loading matches...</p>
                    </div>
                    
                </div>
            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/app.js?v=2"></script>
    <script type="module" src="js/feed.js"></script>
</body>
</html>
